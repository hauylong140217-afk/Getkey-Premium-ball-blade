<!DOCTYPE html>
<html>
<head>
    <title>KEN CUTE TV - GET KEY</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 100px; }
        .container { background: #151515; padding: 40px; border-radius: 20px; border: 2px solid #007bff; display: inline-block; box-shadow: 0 0 20px #007bff55; }
        .key-text { font-size: 32px; color: #00ff00; font-weight: bold; letter-spacing: 2px; margin: 20px 0; background: #000; padding: 15px; border-radius: 10px; min-width: 250px; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn:hover { background: #0056b3; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEN CUTE TV</h1>
        <p>Đây là Key vĩnh viễn của bạn:</p>
        <div class="key-text" id="keyDisplay">ĐANG TẠO...</div>
        <button class="btn" onclick="copyKey()">COPY KEY VĨNH VIỄN</button>
    </div>

    <script>
        function generateKey() {
            // Dùng Math.floor (chữ M viết hoa) mới đúng chuẩn Web bạn nhé
            let n1 = Math.floor(Math.random() * 10);
            let n2 = Math.floor(Math.random() * 10);
            let n3 = Math.floor(Math.random() * 10);
            let n4 = Math.floor(Math.random() * 10);
            
            // Quy luật bí mật: số thứ 5 là số dư của tổng 4 số đầu chia cho 9
            let n5 = (n1 + n2 + n3 + n4) % 9; 
            
            return `kencute24${n1}${n2}${n3}${n4}${n5}`;
        }

        // Chạy hàm và hiển thị lên màn hình
        window.onload = function() {
            const myKey = generateKey();
            document.getElementById('keyDisplay').innerText = myKey;
        };

        function copyKey() {
            const keyText = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(keyText);
            alert("Đã copy Key: " + keyText);
        }
    </script>
</body>
</html>
